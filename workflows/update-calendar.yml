name: Update D2HP Calendar

on:
  schedule:
    - cron: '2-59/5 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-update
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update ICS
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python scripts/update_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/calendar.ics

          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "chore: update calendar feed"
            git push
          fi
